<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 14px 16px; width: 220px;
      font: 13px/1.4 system-ui, "Microsoft JhengHei", sans-serif;
      background: #1f1f1f; color: #e3e3e3;
    }
    h1 { font-size: 14px; margin: 0 0 12px; }
    fieldset { border: 0; padding: 0; margin: 0 0 12px; }
    legend { color: #9aa0a6; font-size: 12px; margin-bottom: 4px; }
    label { display: block; padding: 3px 0; cursor: pointer; }
    p { color: #9aa0a6; font-size: 11px; margin: 0; }
  </style>
</head>
<body>
  <h1>Docs True Dark</h1>
  <fieldset>
    <legend>深色模式</legend>
    <label><input type="radio" name="mode" value="on"> 開啟</label>
    <label><input type="radio" name="mode" value="off"> 關閉</label>
    <label><input type="radio" name="mode" value="auto"> 跟隨系統</label>
  </fieldset>
  <fieldset>
    <legend>主題</legend>
    <label><input type="radio" name="theme" value="dark"> 深灰</label>
    <label><input type="radio" name="theme" value="black"> 純黑（OLED）</label>
    <label><input type="radio" name="theme" value="dim"> 柔和</label>
  </fieldset>
  <p>切換後已開啟的文件會自動重新整理。</p>
  <script src="popup.js"></script>
</body>
</html>
