<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d3250"/>
      <stop offset="1" stop-color="#141625"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#42a5f5"/>
      <stop offset="1" stop-color="#90caf9"/>
    </linearGradient>
    <clipPath id="photo"><rect x="31" y="56" width="50" height="36" rx="5"/></clipPath>
    <mask id="moon">
      <rect width="128" height="128" fill="#fff"/>
      <circle cx="108" cy="22" r="17" fill="#000"/>
    </mask>
  </defs>

  <!-- tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- dark document page with folded corner -->
  <path d="M30 14 H76 L98 36 V108 a8 8 0 0 1 -8 8 H30 a8 8 0 0 1 -8 -8 V22 a8 8 0 0 1 8 -8 Z" fill="#3b4052"/>
  <path d="M76 14 V30 a6 6 0 0 0 6 6 H98 Z" fill="#5a6075"/>

  <!-- light text lines -->
  <rect x="31" y="27" width="34" height="6" rx="3" fill="#d6dae4"/>
  <rect x="31" y="40" width="54" height="6" rx="3" fill="#9aa1b4"/>

  <!-- full-colour photo, untouched -->
  <g clip-path="url(#photo)">
    <rect x="31" y="56" width="50" height="36" fill="url(#sky)"/>
    <circle cx="68" cy="67" r="6" fill="#ffca28"/>
    <path d="M29 94 L48 70 L60 84 L68 76 L84 94 Z" fill="#43a047"/>
    <path d="M29 94 L42 80 L54 94 Z" fill="#66bb6a"/>
  </g>
  <rect x="31" y="100" width="44" height="6" rx="3" fill="#9aa1b4"/>

  <!-- crescent moon -->
  <circle cx="98" cy="30" r="20" fill="#ffd54f" mask="url(#moon)"/>
</svg>
